#This file is used to package the ComicScanner plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.13.3
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-comic-scanner"
description = "A short description of the project"
dynamic = ["version"]
authors = [
    { name = "Just Us Brothers",email = "info@justusbrothers.shop" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://inventree.justusbrothers.shop"

[project.entry-points."inventree_plugins"]
ComicScanner = "comic_scanner.core:ComicScanner"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "comic_scanner.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["comic_scanner"]
